name: E2E
# The unpacked extension in headless Chrome (Puppeteer) against a real Odoo 18 and 19 (e2e/compose.yml): the panel
# opens, every tab's cards load without an error, the RPC log and the Code tab work, nothing logs an error.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        odoo: ['18', '19']
    name: e2e (Odoo ${{ matrix.odoo }})
    env:
      ODOO_VERSION: ${{ matrix.odoo }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Allow Chrome's sandbox # Ubuntu 24.04's AppArmor blocks the user namespaces it needs
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      - name: Start Odoo ${{ matrix.odoo }}
        run: docker compose -f e2e/compose.yml up -d --wait
      - run: npm run e2e
      - name: Odoo log
        if: failure()
        run: docker compose -f e2e/compose.yml logs odoo --tail 200
