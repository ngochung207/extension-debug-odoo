name: CI
on:
  push:
    branches-ignore: [main] # main runs CI through release.yml
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: find src tools -name '*.js' -o -name '*.mjs' | xargs -n1 node --check
      - name: Manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json'))"
      - name: Tests
        run: npm test
      - name: i18n up to date
        run: npm run i18n && git diff --exit-code i18n/
