# Odoo for the end-to-end tests (e2e/panel.e2e.mjs): ODOO_VERSION=18 or 19, database "e2e", login admin / admin.
#   ODOO_VERSION=19 docker compose -f e2e/compose.yml up -d --wait && npm run e2e
services:
  db:
    image: postgres:16
    environment: # a throwaway database on the compose network only: no password
      POSTGRES_USER: odoo
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: pg_isready -U odoo
      interval: 2s
      retries: 30
  odoo:
    image: odoo:${ODOO_VERSION:-18}
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
    command: -d e2e -i base --db-filter=^e2e$$ --without-demo=all
    ports:
      - 8069:8069
    healthcheck:
      test: curl -fs http://localhost:8069/web/login >/dev/null
      interval: 5s
      retries: 60
